plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.88'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_file_name}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        client {
            client()
            gameDirectory = project.file('run/client')
            if (project.hasProperty('quickConnect')) {
                programArguments = ['--quickPlayMultiplayer', project.property('quickConnect').toString()]
            }
        }

        server {
            server()
            gameDirectory = project.file('run/server')
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gameTestServer')
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments = [
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            ]
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation "io.github.llamalad7:mixinextras-neoforge:0.5.3"
    // curios
    compileOnly "curse.maven:curios-309927:6529130"
    // attribute fix
	compileOnly "curse.maven:attributefix-280510:4648448"
    // max health fix
	compileOnly "curse.maven:max-health-fix-492246:4648479"
    // dummy target
	compileOnly "curse.maven:mmmmmmmmmmmm-225738:4602101"
	compileOnly "curse.maven:selene-499980:4656567"
    // jei
	compileOnly "curse.maven:jei-238222:4644453"
    // apple skin
	compileOnly "curse.maven:appleskin-248787:4605078"
    // apotheosis
    compileOnly "curse.maven:placebo-283644:5414631"
    if (file('Mods_Compat/ApothicAttributes-1.21.1-2.10.1.jar').exists()) {
        compileOnly files('Mods_Compat/ApothicAttributes-1.21.1-2.10.1.jar')
    } else {
        compileOnly "curse.maven:apothic-attributes-898963:5529789"
    }
    // spells and spellbooks
    compileOnly "curse.maven:irons-spells-n-spellbooks-855414:8680204"
    compileOnly "curse.maven:geckolib-388172:7553267"
    compileOnly "curse.maven:playeranimator-658587:4587214"
}

def resourceTargets = ['META-INF/neoforge.mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        java_version: java_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
